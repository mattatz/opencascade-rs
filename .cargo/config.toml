[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+exception-handling"
]

[target.wasm32-unknown-emscripten]
rustflags = [
    "-C", "link-arg=-fexceptions",
    "-C", "link-arg=-sDISABLE_EXCEPTION_CATCHING=0",
    "-C", "link-arg=-sSTANDALONE_WASM=0",
    "-C", "link-arg=-sEXPORTED_RUNTIME_METHODS=['cwrap','ccall']",
    "-C", "link-arg=-sEXPORT_ALL=1",
    "-C", "link-arg=-sERROR_ON_UNDEFINED_SYMBOLS=0"
]

[env]
# Enable C++ exceptions for WASM builds
CXXFLAGS = "-fexceptions"
