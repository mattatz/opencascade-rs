[package]
name = "opencascade-sys"
description = "Rust bindings to the OpenCascade CAD Kernel"
authors = ["Brian Schwind <brianmschwind@gmail.com>"]
license = "LGPL-2.1"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/bschwind/opencascade-rs"

[dependencies]
cxx = "1"

[build-dependencies]
cmake = "0.1"
cxx-build = "1"
# occt-sys = { version = "0.6", optional = true }
occt-sys = { path = "../occt-sys", optional = true }

[features]
builtin = ["occt-sys"]
# Build OCCT as shared libraries (dylib/dll/so) instead of static archives.
# Required for LGPL-2.1 compliant dynamic linking in commercial distributions.
# Implies `builtin` — OCCT is built from source either way.
builtin-shared = ["builtin"]
