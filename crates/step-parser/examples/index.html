<!DOCTYPE html>
<html>
  <meta charset="utf-8" />
  <title>STEP Parser</title>
  <body>
    <input type="file" id="stepFileInput" accept=".step,.stp" />
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        createStepParserModule().then((module) => {
          console.log("Module loaded");

          const fileInput = document.getElementById("stepFileInput");
          fileInput.addEventListener("change", async (event) => {
            const file = event.target.files[0];
            if (!file) {
              return;
            }

            try {
              const arrayBuffer = await file.arrayBuffer();
              const bytes = new Uint8Array(arrayBuffer);
              const len = bytes.length;

              // Copy data to Emscripten heap memory
              // Check if _malloc is available (via asm)
              const malloc =
                module._malloc || (module.asm && module.asm._malloc);
              const free = module._free || (module.asm && module.asm._free);

              if (!malloc) {
                console.error("malloc function not found");
                console.log(
                  "Available functions:",
                  Object.keys(module).filter((k) => k.startsWith("_"))
                );
                return;
              }

              const ptr = malloc(len);
              if (!ptr) {
                console.error("memory allocation failed");
                return;
              }

              module.HEAPU8.set(bytes, ptr);

              const res = module._parse_step(ptr, len);
              free?.(ptr);

              if (res) {
                const utf8ToString =
                  module.UTF8ToString ||
                  (module.asm && module.asm.UTF8ToString);
                if (utf8ToString) {
                  const s = utf8ToString(res);
                  console.log(JSON.parse(s));
                } else {
                  console.log("Parsing result (pointer):", res);
                }

                module._free_step?.(res);
              } else {
                console.error("STEP file parsing failed");
              }
            } catch (error) {
              console.error("File reading failed:", error);
            }
          });
        });
      });
    </script>
    <script src="../../../target/wasm32-unknown-emscripten/release/step-parser.js"></script>
  </body>
</html>
