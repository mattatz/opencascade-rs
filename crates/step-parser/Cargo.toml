[package]
name = "step-parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opencascade = { path = "../opencascade" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.24", features = ["serde"] }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
