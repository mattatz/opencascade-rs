[package]
name = "step-parser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "step_parser"
path = "src/main.rs"

[dependencies]
opencascade = { path = "../opencascade" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.24", features = ["serde"] }
typeshare = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
